<!DOCTYPE html>
<html>

<head>

    <title>Connexion Admin</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-box">

    <h2>Connexion Administrateur</h2>

    {% if erreur %}

        <p style="color:red; text-align:center;">
            {{ erreur }}
        </p>

    {% endif %}

    <form method="POST">

        <input type="text"
        name="username"
        placeholder="Identifiant Admin"
        required>

        <input type="password"
        name="password"
        placeholder="Mot de passe"
        required>

        <button type="submit">

            Connexion Admin

        </button>

    </form>

</div>

</body>
</html>
